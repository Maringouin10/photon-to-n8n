services:
  imessage-bridge:
    build: .
    container_name: photon-imessage-bridge
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - nexus-network
    # Pas de "ports:" ici volontairement : ni 8105 ni 8106 ne sont publiés sur
    # l'hôte/LAN. n8n et Nginx Proxy Manager sont déjà sur nexus-network et
    # peuvent appeler ce conteneur par son nom (voir README).

networks:
  nexus-network:
    external: true
    name: mon-serveur_nexus-network
