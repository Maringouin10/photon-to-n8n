services:
  imessage-bridge:
    build: .
    container_name: photon-imessage-bridge
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - nexus-network
    # Pas de "ports:" ici volontairement : 8105 n'est jamais publié sur
    # l'hôte/LAN. n8n est déjà sur nexus-network et peut appeler ce conteneur
    # par son nom (voir README). Le conteneur n'a besoin que d'un accès
    # internet SORTANT (il ouvre lui-même la connexion vers Photon).

networks:
  nexus-network:
    external: true
    name: mon-serveur_nexus-network
