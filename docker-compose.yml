services:
  imessage-bridge:
    build: .
    container_name: photon-imessage-bridge
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - photon_bridge_net
    # Pas de "ports:" ici volontairement : ni 8105 ni 8106 ne sont publiés sur
    # l'hôte/LAN. n8n et Nginx Proxy Manager doivent rejoindre ce même réseau
    # Docker et appeler le conteneur par son nom (voir README) :
    #   docker network connect photon_bridge_net <conteneur_n8n>
    #   docker network connect photon_bridge_net <conteneur_npm>

networks:
  photon_bridge_net:
    name: photon_bridge_net
